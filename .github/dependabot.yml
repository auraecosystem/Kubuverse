# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/" # Change if your Dockerfile is in a subfolder like "/stella"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven" # Or "gradle" if using Gradle
    directory: "/" # Change to the folder containing pom.xml or build.gradle
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/" # Change to the folder containing requirements.txt or pyproject.toml
    schedule:
      interval: "weekly"
