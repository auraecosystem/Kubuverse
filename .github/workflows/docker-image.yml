name: Backend API CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "backend/main.py"
      - "backend/Dockerfile"
      - "routes/**"
      - "services/**"
      - "requirements.txt"
      - "tests/test_repository_analyzer.py"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/main.py"
      - "backend/Dockerfile"
      - "routes/**"
      - "services/**"
      - "requirements.txt"
      - "tests/test_repository_analyzer.py"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run repository analyzer tests
        run: python -m unittest tests.test_repository_analyzer -v

      - name: Build backend API image
        run: docker build --file backend/Dockerfile --tag kubuverse-backend:ci .
